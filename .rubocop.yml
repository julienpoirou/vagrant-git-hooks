inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

plugins:
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude
    - Include

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/vagrant-git-hooks/command.rb'

Metrics/MethodLength:
  Exclude:
    - 'lib/vagrant-git-hooks/command.rb'

Metrics/AbcSize:
  Exclude:
    - 'lib/vagrant-git-hooks/command.rb'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'lib/vagrant-git-hooks/command.rb'

Style/Documentation:
  Enabled: false

# Files are written with LF; don't fight the platform's native EOL.
Layout/EndOfLine:
  Enabled: false

# This project consistently uses double-quoted strings.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Dev deps are declared in the gemspec (mirrors the sibling plugins).
Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Naming/FileName:
  Exclude:
    - 'lib/vagrant-git-hooks.rb'

RSpec:
  Language:
    Expectations:
      - expect
